name: Build Vast.ai Image (MT Reel Studio v2)

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/**'
      - '_engine/**'
      - 'branding/**'
      - '.dockerignore'
      - '.github/workflows/build-vast-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space on runner (cho image CUDA + 3 venv)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android || true
          docker system prune -af || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push MT Reel Studio v2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mt-reel-studio:v2
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Build Vast.ai App Layer (Fast <2 min)

on:
  push:
    branches: [ main ]
    paths:
      - 'docker/Dockerfile.app'
      - 'docker/entrypoint.sh'
      - '.github/workflows/build-vast-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-app-layer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push fast app overlay (:v2-app)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile.app
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/mt-reel-studio:v2-app
